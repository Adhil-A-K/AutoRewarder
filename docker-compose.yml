# AutoRewarder — Docker Compose
# Two services:
#   1. ts (Tailscale sidecar) — routes all traffic through phone exit node
#   2. autorewarder — Brave browser + AutoRewarder automation
#
# autorewarder uses network_mode: service:ts, meaning all its network
# traffic goes through the Tailscale sidecar. The host VPS is unaffected.
#
# Usage:
#   1. Copy .env.example to .env and fill in your values
#   2. docker compose build
#   3. docker compose up -d
#   4. Connect VNC to <vps-tailscale-ip>:5900 for first-time login
#   5. After login: docker compose exec autorewarder python3 AutoRewarder_CLI.py --headless

services:
  # --- Tailscale sidecar ---
  ts:
    image: tailscale/tailscale:latest
    container_name: autorewarder-ts
    hostname: autorewarder
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale-state:/var/lib/tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--exit-node=${PHONE_TS_IP} --exit-node-allow-lan-access --accept-routes
      - TS_USERSPACE=false
    # VNC port exposed here because autorewarder shares this network namespace
    ports:
      - "5900:5900"  # VNC (for first-time account login)

  # --- AutoRewarder ---
  autorewarder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Locale/timezone baked into the image at build time
        LOCALE_GEN: ${LANG:-en_IN.UTF-8}
        LOCALE: ${LANG:-en_IN.UTF-8}
        LANGUAGE_VAL: ${LANGUAGE:-en_IN:en}
        TZ: ${TZ:-Asia/Kolkata}
    image: autorewarder:latest
    container_name: autorewarder
    restart: unless-stopped
    network_mode: service:ts  # All traffic goes through Tailscale sidecar
    depends_on:
      ts:
        condition: service_started
    volumes:
      - autorewarder-data:/data  # Persistent: browser profiles, history, stats
    environment:
      - DISPLAY=:99
      - PHONE_API_IP=${PHONE_TS_IP}
      - PHONE_API_PORT=${PHONE_API_PORT:-9090}
      - HOME_DIR=/data
      - TZ=${TZ:-Asia/Kolkata}
      - LANG=${LANG:-en_IN.UTF-8}
      - LC_ALL=${LC_ALL:-en_IN.UTF-8}
      - LANGUAGE=${LANGUAGE:-en_IN:en}
      - BROWSER_LANG=${BROWSER_LANG:-en-IN}
      - BROWSER_ACCEPT_LANG=${BROWSER_ACCEPT_LANG:-en-IN,en;q=0.9}
    # Wait for Tailscale exit node before starting
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Tailscale exit node to become active..."
        # Be patient — phone exit node may take time over mobile data.
        for i in $$(seq 1 90); do
          EXTERNAL_IP=$$(curl -sf --max-time 5 https://api.ipify.org 2>/dev/null || echo "")
          if [ -n "$$EXTERNAL_IP" ]; then
            echo "  Exit node active! External IP: $$EXTERNAL_IP"
            break
          fi
          echo "  waiting for exit node... ($$i/90)"
          sleep 3
        done
        exec /app/scripts/entrypoint.sh

volumes:
  tailscale-state:
    driver: local
  autorewarder-data:
    driver: local
